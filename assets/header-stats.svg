<svg xmlns="http://www.w3.org/2000/svg" width="300" height="62" viewBox="0 0 300 62" shape-rendering="crispEdges" role="img" aria-label="STATS 角色属性"><title>STATS 角色属性</title><style>
.bob{animation:bob 1.2s infinite}
@keyframes bob{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-6px)}}
.blink{animation:blink 1s infinite}
@keyframes blink{0%,59%{opacity:1}60%,100%{opacity:0}}
.ray{animation:blink 1.6s infinite}
.xp{transform-box:fill-box;transform-origin:left center;animation:xp 6s steps(1) infinite}
@keyframes xp{0%{transform:scaleX(.15)}15%{transform:scaleX(.3)}30%{transform:scaleX(.45)}45%{transform:scaleX(.6)}60%,100%{transform:scaleX(.72)}}
.drift{animation:drift 30s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-960px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
