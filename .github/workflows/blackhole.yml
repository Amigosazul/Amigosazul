name: Contribution black hole

on:
  schedule:
    - cron: "0 16 * * *" # every day 00:00 Beijing time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/blackhole.js, .github/workflows/blackhole.yml]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render SVG
        run: node scripts/blackhole.js "${{ github.repository_owner }}" assets/blackhole.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/blackhole.svg
          git diff --cached --quiet || (git commit -m "Update contribution black hole" && git push)
